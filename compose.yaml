name: simtakt

x-app: &app
  build: .
  image: simtakt:local
  init: true
  user: "${SIMTAKT_UID:-10001}:${SIMTAKT_GID:-10001}"
  restart: unless-stopped
  stop_grace_period: 30s

x-http-health: &http-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8321/api/health', timeout=3)"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  demo:
    <<: *app
    profiles: [demo]
    ports:
      - "127.0.0.1:${SIMTAKT_HTTP_PORT:-8321}:8321"
    healthcheck: *http-health

  web:
    <<: *app
    profiles: [project]
    command: ["python", "-m", "control_plane.web.status_server", "--project-root", "/workspace", "--host", "0.0.0.0", "--allow-writes", "--allow-remote-writes"]
    ports:
      - "127.0.0.1:${SIMTAKT_HTTP_PORT:-8321}:8321"
    healthcheck: *http-health
    volumes: &project-files
      - type: bind
        source: ${SIMTAKT_PROJECT_ROOT:-./workspace}
        target: /workspace
        bind:
          create_host_path: false

  runtime:
    <<: *app
    profiles: [project]
    command: ["python", "-m", "control_plane.runtime", "--project-root", "/workspace"]
    volumes: *project-files
