<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>评测控制台</title>
<style>
  /* ================= design tokens ================= */
  :root {
    --bg: #0b0e12;
    --bg-soft: #0f141a;
    --surface: #141a21;
    --surface-2: #1a222b;
    --surface-3: #252f3a;
    --line: #29333e;
    --line-soft: #202932;
    --fg: #e2e7ed;
    --fg-dim: #9aa5b3;
    --fg-faint: #687483;
    --accent: #82b4e4;

    --tone-gray:  #9ba7b5;
    --tone-dim:   #737e8c;
    --tone-blue:  #82b4e4;
    --tone-amber: #c7a86a;
    --tone-green: #79b789;
    --tone-red:   #cf8079;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
            "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo,
            "Liberation Mono", monospace;

    --radius: 7px;
    --page-max: 1440px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }

  .mono { font-family: var(--mono); }
  .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.num { font-family: var(--sans); }
  .sub { color: var(--fg-faint); font-size: 11px; font-family: var(--mono); }
  .dim { color: var(--fg-dim); }

  .wrap { max-width: var(--page-max); margin: 0 auto; padding: 0 20px; }

  /* ================= top bar ================= */
  .topbar {
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding-top: 9px; padding-bottom: 9px;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: 2px; }
  .brand .mark { display: inline-flex; flex-direction: column; gap: 2.5px; padding-top: 1px; }
  .brand .mark i { display: block; height: 2.5px; border-radius: 2px; background: var(--accent); }
  .brand .mark i:nth-child(1) { width: 15px; }
  .brand .mark i:nth-child(2) { width: 11px; background: var(--tone-green); }
  .brand .mark i:nth-child(3) { width: 7px;  background: var(--tone-amber); }
  .brand .name { font-size: 14px; font-weight: 600; letter-spacing: .02em; }
  .brand .tag  { font-size: 10.5px; color: var(--fg-faint); font-family: var(--mono); margin-left: 2px; }

  nav.mainnav { display: flex; gap: 2px; }
  nav.mainnav a {
    color: var(--fg-dim); padding: 4px 11px; border-radius: 6px;
    border: 1px solid transparent; font-size: 12.5px;
  }
  nav.mainnav a:hover { color: var(--fg); text-decoration: none; background: var(--surface-2); }
  nav.mainnav a.cur { color: var(--fg); background: var(--surface-2); border-color: var(--line); }

  .topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .health { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .hdot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); flex: none; }
  .hdot.ok  { background: var(--tone-green); box-shadow: 0 0 0 3px rgba(99,189,118,.15); }
  .hdot.bad { background: var(--tone-red);   box-shadow: 0 0 0 3px rgba(224,108,96,.15); }

  select, input[type="text"], textarea {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    font: 12.5px var(--sans); padding: 4px 8px;
  }
  textarea { width: 100%; min-height: 64px; resize: vertical; font-family: var(--mono); }
  input[type="number"] { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  select:hover, input[type="text"]:hover, textarea:hover { border-color: var(--fg-faint); }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--fg-faint); }
  .submit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .submit-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .submit-card h3 { margin: 0 0 10px; font-size: 13px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .form-row.one { grid-template-columns: 1fr; }
  .form-field { display: flex; flex-direction: column; gap: 3px; color: var(--fg-dim); font-size: 11.5px; }
  .form-field input, .form-field select { width: 100%; }
  .submit-card button { margin-top: 8px; }
  .submit-msg { margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .submit-msg.ok { color: var(--tone-green); }
  .submit-msg.err { color: var(--tone-red); }
  .readonly-note { background: #352712; border: 1px solid #5d4420; color: #e8bd82; border-radius: var(--radius); padding: 9px 12px; margin-bottom: 12px; }
  pre.preview { background: var(--bg-soft); border: 1px solid var(--line-soft); padding: 8px; overflow: auto; white-space: pre-wrap; word-break: break-word; max-height: 260px; font: 11px/1.45 var(--mono); }

  button.plain {
    background: var(--surface-2); color: var(--fg-dim);
    border: 1px solid var(--line); border-radius: 6px;
    font: 12px var(--sans); padding: 4px 10px; cursor: pointer;
  }
  button.plain:hover { color: var(--fg); border-color: var(--fg-faint); }
  button.plain[aria-pressed="true"] { color: var(--tone-amber); border-color: rgba(217,165,69,.5); }

  /* ================= stale banner ================= */
  #banner {
    display: none;
    background: #352712;
    border-bottom: 1px solid #5d4420;
    color: #e8bd82;
    font-size: 12.5px;
  }
  #banner.show { display: block; }
  #banner .wrap { padding-top: 7px; padding-bottom: 7px; display: flex; gap: 9px; align-items: center; }
  #banner .bicon {
    width: 7px; height: 7px; border-radius: 50%; background: var(--tone-amber); flex: none;
  }

  main.wrap { padding-top: 20px; padding-bottom: 56px; }
  main.stale { opacity: .62; }

  /* ================= page head / sections ================= */
  .page-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 2px 0 16px; }
  .page-head h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .page-head h1 .mono { font-size: 15.5px; }
  .page-head .desc { color: var(--fg-dim); font-size: 12.5px; }

  h2.section {
    font-size: 12px; font-weight: 600; color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: .08em;
    margin: 22px 0 9px; display: flex; align-items: center; gap: 10px;
  }
  h2.section::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  /* ================= stat cards ================= */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 0 0 6px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-top: 2px solid var(--card-tone, var(--line));
    border-radius: var(--radius); padding: 11px 14px 10px;
  }
  .card .card-label { font-size: 12px; color: var(--fg-dim); }
  .card .card-num {
    font: 24px/1.25 var(--mono); font-variant-numeric: tabular-nums;
    color: var(--card-tone, var(--fg)); margin-top: 1px;
  }
  .card .card-foot { font-size: 11px; color: var(--fg-faint); margin-top: 2px; font-family: var(--mono); }
  .card.t-gray  { --card-tone: var(--tone-gray); }
  .card.t-blue  { --card-tone: var(--tone-blue); }
  .card.t-amber { --card-tone: var(--tone-amber); }
  .card.t-green { --card-tone: var(--tone-green); }
  .card.t-red   { --card-tone: var(--tone-red); }
  .card.t-plain { --card-tone: var(--fg); }
  .card.alert { background: #2c2110; border-color: #5d4420; }

  /* ================= chips ================= */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 1px 9px 1.5px; border-radius: 999px;
    border: 1px solid var(--line);
    font: 11px/1.7 var(--mono); white-space: nowrap;
    color: var(--fg-dim); background: var(--surface-2);
  }
  .chip .cdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .tone-gray  { color: var(--tone-gray);  border-color: rgba(152,162,176,.32); background: rgba(152,162,176,.08); }
  .tone-dim   { color: var(--tone-dim);   border-color: rgba(107,116,128,.28); background: rgba(107,116,128,.07); }
  .tone-blue  { color: var(--tone-blue);  border-color: rgba(110,168,224,.38); background: rgba(110,168,224,.10); }
  .tone-amber { color: var(--tone-amber); border-color: rgba(217,165,69,.38);  background: rgba(217,165,69,.10); }
  .tone-green { color: var(--tone-green); border-color: rgba(99,189,118,.38);  background: rgba(99,189,118,.10); }
  .tone-red   { color: var(--tone-red);   border-color: rgba(224,108,96,.40);  background: rgba(224,108,96,.10); }

  /* status filter chips (buttons) */
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; align-items: center; }
  .fchips .flabel { color: var(--fg-faint); font-size: 11.5px; margin-right: 2px; }
  button.fchip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 1px 9px 1.5px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); font: 11px/1.7 var(--mono); white-space: nowrap;
    color: var(--fg-dim); background: var(--surface);
  }
  button.fchip .cdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  button.fchip .cnt { color: var(--fg-faint); }
  button.fchip:hover { border-color: currentColor; }
  button.fchip[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
  button.fchip[aria-pressed="true"] .cnt { color: currentColor; }

  /* ================= tables ================= */
  .table-wrap {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); margin-bottom: 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--surface);
    color: var(--fg-dim); font-weight: 600; font-size: 11.5px;
    text-align: left; padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child  { border-top-right-radius: var(--radius); }
  tbody td {
    padding: 7px 12px; border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
  }
  tbody tr:last-child > td { border-bottom: none; }
  tbody tr:hover > td { background: rgba(255,255,255,.022); }
  td.wrap, th.wrap { white-space: normal; word-break: break-all; }
  tr.evrow { cursor: pointer; }
  tr.evrow:hover > td { background: rgba(110,168,224,.05); }
  tr.subrow > td { background: var(--bg-soft); padding: 6px 12px 10px 34px; }
  tr.subrow:hover > td { background: var(--bg-soft); }
  tr.lowconf > td { background: rgba(217,165,69,.045); }
  tr.lowconf:hover > td { background: rgba(217,165,69,.075); }

  .subtable { font-size: 12px; margin: 2px 0; }
  .subtable thead th { position: static; background: transparent; border-bottom: 1px dashed var(--line); padding: 4px 10px; }
  .subtable tbody td { border-bottom: 1px dotted var(--line-soft); padding: 4px 10px; }

  .expand-btn {
    background: none; border: 1px solid var(--line); border-radius: 5px;
    color: var(--fg-dim); cursor: pointer; font: 11px/1 var(--mono);
    width: 20px; height: 20px; padding: 0;
  }
  .expand-btn:hover { color: var(--fg); border-color: var(--fg-faint); }

  .idcell .cid { display: block; margin-top: 1px; }

  /* distribution proportion bar */
  .dist-cell { display: flex; align-items: center; gap: 10px; min-width: 230px; }
  .distbar {
    display: flex; height: 8px; border-radius: 4px; overflow: hidden;
    background: var(--surface-3); flex: 1 1 110px; min-width: 90px; max-width: 200px;
  }
  .distbar i { display: block; height: 100%; }
  .distbar i + i { border-left: 1px solid var(--surface); }
  .dist-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .dchip {
    display: inline-flex; align-items: center; gap: 5px;
    font: 10.5px/1.6 var(--mono); padding: 0 6px;
    border: 1px solid var(--line-soft); border-radius: 4px; color: var(--fg-dim);
    white-space: nowrap;
  }
  .dchip .cdot { width: 5px; height: 5px; border-radius: 50%; }

  /* license usage bar */
  .usage { display: inline-flex; align-items: center; gap: 9px; }
  .usage .track {
    width: 110px; height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden;
  }
  .usage .fill { display: block; height: 100%; background: var(--tone-blue); border-radius: 4px; }
  .usage .fill.hot { background: var(--tone-amber); }
  .usage .utxt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--fg-dim); white-space: nowrap; }

  .tag {
    display: inline-block; font: 10px/1.6 var(--sans); padding: 0 5px;
    border-radius: 4px; border: 1px solid rgba(217,165,69,.45); color: var(--tone-amber);
    margin-left: 6px; vertical-align: 1px;
  }

  /* ================= states ================= */
  .empty-panel {
    border: 1px dashed var(--line); border-radius: var(--radius);
    background: var(--surface); padding: 46px 20px; text-align: center; margin-bottom: 8px;
  }
  .empty-glyph { display: inline-flex; flex-direction: column; gap: 3px; margin-bottom: 12px; opacity: .8; }
  .empty-glyph i { display: block; height: 3px; border-radius: 2px; background: var(--surface-3); }
  .empty-glyph i:nth-child(1) { width: 34px; }
  .empty-glyph i:nth-child(2) { width: 24px; }
  .empty-glyph i:nth-child(3) { width: 15px; }
  .empty-title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .empty-desc { color: var(--fg-dim); font-size: 12.5px; }

  .alert-error {
    background: #331d1f; border: 1px solid #5c3336; color: #eaa79f;
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px;
    font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-all;
  }
  .alert-error .hint { display: block; margin-top: 6px; color: #c0837c; font-family: var(--sans); }

  .meta-grid {
    display: flex; flex-wrap: wrap; gap: 8px 26px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
  }
  .meta-grid .mi { font-size: 12.5px; color: var(--fg-dim); }
  .meta-grid .mi b, .meta-grid .mi a { color: var(--fg); font-weight: 600; }
  .meta-grid .mi .mono { font-family: var(--mono); font-weight: 400; }

  .toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 0 0 12px; }
  .toolbar input[type="text"] { width: 19em; max-width: 44vw; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-dim); font-size: 12.5px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; cursor: pointer; }
  .toolbar .result-n { color: var(--fg-faint); font-size: 11.5px; font-family: var(--mono); }

  /* skeleton */
  .sk-block {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  }
  .sk-line { height: 10px; border-radius: 4px; background: var(--surface-3); margin: 9px 0; position: relative; overflow: hidden; }
  .sk-line::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
    animation: shimmer 1.7s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  @media (prefers-reduced-motion: reduce) {
    .sk-line::after { animation: none; }
    * { transition: none !important; }
  }

  @media (max-width: 1200px) {
    .table-wrap { overflow-x: auto; }
    .wrap { padding: 0 14px; }
    main.wrap { padding-top: 14px; }
  }
  /* ================= quiet console refinement ================= */
  .topbar { background: rgba(15,20,26,.96); border-bottom-color: var(--line-soft); }
  .topbar-inner { gap: 22px; padding-top: 11px; padding-bottom: 11px; }
  .brand .name { font-size: 15px; letter-spacing: .015em; }
  .brand .tag { color: var(--fg-dim); letter-spacing: .04em; }
  nav.mainnav { gap: 5px; }
  nav.mainnav a { padding: 5px 12px; color: var(--fg-dim); }
  nav.mainnav a.cur { color: var(--fg); background: transparent; border-color: var(--accent); }
  nav.mainnav a:hover { background: var(--surface); }
  .topbar-right { gap: 12px; }
  .lookup input { width: 210px; }
  .ctl { display: inline-flex; align-items: center; gap: 7px; color: var(--fg-dim); font-size: 12px; }
  select, input[type="text"], input[type="number"], textarea {
    background: #0d1217; border-color: var(--line); border-radius: 5px;
    min-height: 30px; padding: 5px 9px;
  }
  textarea { min-height: 78px; }
  select:focus-visible, input:focus-visible, textarea:focus-visible,
  button:focus-visible, a:focus-visible { outline-offset: 3px; }
  button.plain { background: var(--surface); min-height: 30px; }
  button.plain:disabled, .submit-card button:disabled {
    opacity: .48; cursor: not-allowed; filter: saturate(.55);
  }
  main.wrap { padding-top: 28px; }
  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-size: 19px; }
  .page-head .desc { color: var(--fg-dim); }
  h2.section { margin-top: 30px; margin-bottom: 12px; color: var(--fg-dim); }
  h2.section::after { background: var(--line); }
  .cards { gap: 10px; margin-bottom: 10px; }
  .card {
    background: linear-gradient(145deg, var(--surface), #12171d);
    border-color: var(--line-soft); border-top-width: 1px; padding: 14px 16px 13px;
  }
  .card .card-num { font-size: 26px; margin-top: 4px; }
  .card.alert { background: rgba(83,62,25,.22); border-color: rgba(199,168,106,.36); }
  .meta-grid { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0 0 14px; }
  .toolbar { gap: 18px; margin-bottom: 16px; }
  .table-wrap { background: var(--surface); border-color: var(--line-soft); border-radius: var(--radius); margin-bottom: 14px; }
  thead th { background: var(--surface); padding: 10px 14px; color: var(--fg-dim); }
  tbody td { padding: 9px 14px; }
  tbody tr:hover > td { background: rgba(255,255,255,.028); }
  tr.subrow > td { background: #10161c; padding: 10px 14px 13px 42px; }
  .subtable { color: var(--fg-dim); }
  .subtable thead th { background: transparent; padding-top: 5px; }
  .subtable tbody td { padding-top: 6px; padding-bottom: 6px; }
  .chip { letter-spacing: .01em; }
  .submit-grid { gap: 16px; }
  .submit-card { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 18px 0 8px; }
  .submit-card h3 { color: var(--fg); font-size: 14px; margin-bottom: 16px; }
  .form-row { gap: 14px; margin-bottom: 14px; }
  .form-field { gap: 6px; color: var(--fg-dim); font-size: 12px; }
  .form-field input, .form-field select { min-height: 34px; }
  .submit-card button { margin-top: 12px; min-height: 34px; }
  .submit-msg { padding: 9px 11px; border-left: 2px solid currentColor; background: rgba(255,255,255,.025); }
  .submit-msg:empty { display: none; }
  .submit-msg.err { color: #d58c84; background: rgba(111,48,48,.16); }
  .submit-msg.ok { color: #83bd91; background: rgba(57,105,67,.14); }
  .readonly-note { background: rgba(111,83,32,.17); border-color: rgba(199,168,106,.38); color: #d8ba80; padding: 11px 14px; }
  pre.preview { background: #0d1217; border-color: var(--line-soft); border-radius: 5px; padding: 12px 14px; line-height: 1.55; }
  .alert-error { background: rgba(111,48,48,.18); border-color: rgba(207,128,121,.42); color: #dba09a; }
  .empty-panel { background: transparent; border-color: var(--line); padding: 56px 20px; }
  .sk-block { background: transparent; border-color: var(--line-soft); }
  .sk-line { background: var(--surface-2); }
  @media (max-width: 760px) {
    .topbar-inner { gap: 10px 14px; }
    .topbar-right { width: 100%; margin-left: 0; }
    .lookup, .lookup input { width: 100%; max-width: none; }
    .topbar-right .ctl { margin-left: auto; }
    main.wrap { padding-top: 20px; }
  }
  .sub .chip { font-size: 11.5px; padding-left: 10px; padding-right: 10px; }
  .sub .mono { color: var(--fg); font-weight: 600; }
  td.wrap > .sub { color: var(--fg-dim); }
  .health { color: var(--fg-dim); }
  .health #healthtxt { color: var(--fg); }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="name">评测控制台</span>
      <span class="tag" id="modeTag">EVAL STATUS · 只读</span>
    </div>

/* Returns {ok, status, data}; rejects on network failure. */
function fetchJSON(path) {
  if (MOCK) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        if (window.__mockFail) { reject(new TypeError("mock: network failure")); return; }
        var data = mockPayload(path);
        if (data && data.__http) {
          resolve({ ok: false, status: data.__http, data: { error: data.error } });
        } else {
          resolve({ ok: true, status: 200, data: data });
        }
      }, 30);
    });
  }
  return fetch(path, { cache: "no-store" }).then(function (resp) {
    return resp.json().then(
      function (data) { return { ok: resp.ok, status: resp.status, data: data }; },
      function () {
        return { ok: false, status: resp.status,
                 data: { error: "响应不是合法 JSON (HTTP " + resp.status + ")" } };
      }
    );
  });
}

/* ================= DOM helpers (dynamic text via textContent only) ================= */
function el(tag, cls) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}
function txt(s) { return document.createTextNode(s); }
function th(label, cls) {
  var n = el("th", cls || "", label);
  n.scope = "col";
  return n;
}
function fmt(v) { return v === null || v === undefined || v === "" ? "—" : String(v); }

  ambiguous: "amber",
  unresolved: "red",

};

function chip(status, toneMap) {
  var tone = toneMap[status] || "gray";
  var c = el("span", "chip tone-" + tone);
  c.appendChild(el("i", "cdot"));
  c.appendChild(el("span", "", String(status)));
  c.title = String(status);
  return c;
}

function waitChip(reason) {
  if (reason === null || reason === undefined || reason === "") return txt("—");
  var tone = "red";
  if (reason === "reconciling") tone = "amber";
  else if (reason.indexOf("requeued-after:") === 0) tone = "blue";
  var c = el("span", "chip tone-" + tone);
  c.appendChild(el("i", "cdot"));
  c.appendChild(el("span", "", String(reason)));
  c.title = String(reason);
  return c;
}

/* ================= formatting ================= */
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  var s = Math.floor(ms / 1000);
  var d = Math.floor(s / 86400); s %= 86400;
  var h = Math.floor(s / 3600); s %= 3600;
  var m = Math.floor(s / 60); s %= 60;
  if (d > 0) return d + " 天 " + h + " 小时";
  if (h > 0) return h + " 小时 " + m + " 分";
  if (m > 0) return m + " 分 " + s + " 秒";
  return s + " 秒";
}
function fmtAgo(iso) {
  if (!iso) return "—";
  var t = Date.parse(iso);
  if (isNaN(t)) return String(iso);
  var ms = Date.now() - t;
  if (ms < 15000) return "刚刚";
  return fmtDur(ms) + "前";
}
function fmtWait(iso) {
  if (!iso) return "—";
  var t = Date.parse(iso);
  if (isNaN(t)) return String(iso);
  return fmtDur(Date.now() - t);
}
function fmtClock(iso) {
  if (!iso) return "—";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return String(iso);
  return t.toLocaleString("zh-CN", { hour12: false });
}
function fmtMeanStd(mean, std) {
  if (mean === null || mean === undefined) return "—";
  var m = Number(mean).toFixed(1);
  if (std === null || std === undefined) return m + " ± —";
  return m + " ± " + Number(std).toFixed(1);
}
function fmtGiB(bytes) {
  if (bytes === null || bytes === undefined) return "—";
  return (Number(bytes) / 1073741824).toFixed(2) + " GiB";
}
function fmtBudget(b) {
  if (!b) return "—";
  var w = b.max_wall_seconds === null || b.max_wall_seconds === undefined
    ? "—" : b.max_wall_seconds + "s";
  var c = b.command_timeout_seconds === null || b.command_timeout_seconds === undefined
    ? "—" : b.command_timeout_seconds + "s";
  return "wall ≤ " + w + " · cmd ≤ " + c;
}

function distBar(statusCounts, total) {
  /* compact pure-CSS stacked proportion bar + nonzero count chips */
  var wrap = el("div", "dist-cell");
  var bar = el("div", "distbar");
  bar.setAttribute("role", "img");
  var parts = [];
  EVAL_ORDER.forEach(function (st) {
    var n = statusCounts[st] || 0;
    if (n > 0) parts.push(st + ": " + n);
  });
  bar.setAttribute("aria-label", parts.join(", ") || "无评测");
  var chips = el("span", "dist-chips");
  EVAL_ORDER.forEach(function (st) {
    var n = statusCounts[st] || 0;
    if (n <= 0) return;
    var seg = el("i");
    seg.style.width = total > 0 ? (100 * n / total) + "%" : "0%";
    seg.style.background = "var(--tone-" + (EVAL_STATUS_TONE[st] || "gray") + ")";
    seg.title = st + ": " + n;
    bar.appendChild(seg);
    var d = el("span", "dchip");
    var dot = el("i", "cdot");
    dot.style.background = "var(--tone-" + (EVAL_STATUS_TONE[st] || "gray") + ")";
    d.appendChild(dot);
    d.appendChild(txt(st + " " + n));
    chips.appendChild(d);
  });
  wrap.appendChild(bar);
  wrap.appendChild(chips);
  return wrap;
}

function usageBar(used, total) {
  var w = el("span", "usage");
  var track = el("span", "track");
  var fill = el("span", "fill");
  var pct = 0;
  if (typeof total === "number" && total > 0 && typeof used === "number") {
    pct = Math.min(1, Math.max(0, used / total));
  }
  fill.style.width = (pct * 100).toFixed(1) + "%";
  if (pct >= 0.85) fill.className = "fill hot";
  track.appendChild(fill);
  w.appendChild(track);
  w.appendChild(el("span", "utxt", fmt(used) + " / " + fmt(total)));
  return w;
}

  t.appendChild(body);

  tw.appendChild(t);
  frag.appendChild(tw);

  content.textContent = "";
  content.appendChild(frag);

function apiError(r) {
  if (!r) return "网络异常：无法连接服务器";
  var msg = r.data && r.data.error ? r.data.error : ("HTTP " + r.status);
  if (r.status === 400) return "400 契约错误：" + msg;
  if (r.status === 404) return "404 未找到：" + msg;
  if (r.status === 405) return "405 写入未启用：" + msg;
  if (r.status === 413) return "413 请求过大：" + msg;
  if (r.status >= 500) return r.status + " 服务器错误：" + msg;
  return "HTTP " + r.status + "：" + msg;
}
function jsonValue(id, optional) {
  var s = document.getElementById(id).value.trim();
  if (!s && optional) return undefined;
  if (!s) throw new Error("请输入 JSON");
  try { return JSON.parse(s); } catch (_) { throw new Error("JSON 格式无效"); }
}
function postJSON(path, body) {
  return fetch(path, { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body) }).then(function (resp) {
    return resp.json().then(function (data) { return {ok:resp.ok,status:resp.status,data:data}; });
  }).catch(function () { return null; });
}

  eb.onclick=function(){var cand;try{cand={problem_id:document.getElementById("e-pid").value.trim(),problem_revision:document.getElementById("e-prev").value.trim(),parameters:jsonValue("e-params",false)};}catch(x){submitMsg(em,x.message,false);return;}eb.disabled=true;postJSON("/api/contracts/build",{kind:"candidate",spec:cand}).then(function(cr){if(!cr||!cr.ok){eb.disabled=false;submitMsg(em,apiError(cr),false);return;}state.candidateContract=cr.data.contract;var req={candidate_id:state.candidateContract.candidate_id,fidelity:document.getElementById("e-fid").value.trim(),requested_outputs:document.getElementById("e-outs").value.split(",").map(function(x){return x.trim();}).filter(Boolean),evidence_profile:document.getElementById("e-evidence").value.trim(),independence_requirement:sel.value,priority:document.getElementById("e-priority").value.trim()};if(sel.value==="independent")req.replicate_key=document.getElementById("e-rep").value.trim();return postJSON("/api/contracts/build",{kind:"evaluation_request",spec:req});}).then(function(rr){eb.disabled=false;if(!rr||!rr.ok){submitMsg(em,apiError(rr),false);return;}state.requestContract=rr.data.contract;ep.textContent=JSON.stringify({candidate:state.candidateContract,request:state.requestContract},null,2);ec.disabled=!state.writes;submitMsg(em,"预览完成 · candidate_id "+String(state.candidateContract.candidate_id||"—")+" · evaluation_id "+String(state.requestContract.evaluation_id||"—")+" · idempotency_key "+String(state.requestContract.idempotency_key||"—"),true);});};

function setSubmitDisabled(disabled) {
  var root = document.getElementById("content");
  root.querySelectorAll(".submit-card input,.submit-card textarea,.submit-card select,.submit-card button").forEach(function(n){ n.disabled=disabled || n.disabled; });
}
/* ================= top bar / banner ================= */
var healthDot = document.getElementById("healthdot");
var healthTxt = document.getElementById("healthtxt");
var refreshInfo = document.getElementById("refreshinfo");
var banner = document.getElementById("banner");
var bannerText = document.getElementById("bannertext");
var lastRenderAt = null;
var unreachable = false;

function setHealth(ok, payload) {
  healthDot.className = "hdot " + (ok ? "ok" : "bad");
  healthTxt.textContent = ok ? "服务正常" : "服务异常";
  var oldWrites = state.writes;
  state.writes = !!(ok && payload && payload.writes_enabled === true);
  document.getElementById("modeTag").textContent = state.writes ? "EVAL STATUS · 可提交" : "EVAL STATUS · 只读";
  if (oldWrites !== state.writes && parseRoute().name === "submit") renderSubmit();
}
function updateBanner() {
  if (!unreachable) {
    content.classList.remove("stale");
    return;
  }
  banner.className = "show";
  content.classList.add("stale");
  if (lastRenderAt === null) {
    bannerText.textContent = "服务不可达，暂无可显示的数据，正在重试…";
  } else {
    var n = Math.max(0, Math.round((Date.now() - lastRenderAt) / 1000));
    bannerText.textContent = "服务不可达，正在显示 " + n + " 秒前的数据";
  }
}
setInterval(updateBanner, 1000);

function markNav(route) {
  document.getElementById("nav-overview").className = route.name === "overview" ? "cur" : "";
  document.getElementById("nav-capacity").className = route.name === "capacity" ? "cur" : "";
  document.getElementById("nav-shapes").className = route.name === "shapes" ? "cur" : "";
  document.getElementById("nav-submit").className = route.name === "submit" ? "cur" : "";
}

/* ================= routing ================= */
function parseRoute() {
  var h = location.hash || "#/";
  if (h === "#" || h === "#/") return { name: "overview" };
  var m;
  if (h === "#/capacity") return { name: "capacity" };
  if (h === "#/shapes") return { name: "shapes" };
  if ((m = h.match(/^#\/study\/(.+)$/))) return { name: "study", id: decodeURIComponent(m[1]) };
  if (h === "#/submit") return { name: "submit" };
  if ((m = h.match(/^#\/problem\/(.+)$/))) return { name: "problem", id: decodeURIComponent(m[1]) };
  return { name: "unknown", raw: h };
}

var TITLE = { overview: "总览", capacity: "容量", shapes: "形状",
              study: "Study", problem: "Problem" };

/* ================= refresh loop ================= */
var refreshSeq = 0;
function refreshHealth() {
  return fetchJSON("/api/health").then(
    function (r) { setHealth(r.ok && r.data && r.data.status === "ok", r.data); },
    function () { setHealth(false, null); }
  );
}

function refreshRoute() {
  var route = parseRoute();
  markNav(route);
  var seq = ++refreshSeq;
  var stale = function () { return seq !== refreshSeq; };

  var path;
  if (route.name === "overview") path = "/api/overview";
  else if (route.name === "capacity") path = "/api/capacity";
  else if (route.name === "shapes") path = "/api/shapes";
  else if (route.name === "study") path = "/api/studies/" + encodeURIComponent(route.id);
  else if (route.name === "problem") path = "/api/problems/" + encodeURIComponent(route.id);
  else if (route.name === "submit") {
    unreachable = false; updateBanner(); renderSubmit();
    document.title = "提交 · 评测控制台"; return Promise.resolve();
  } else {
    unreachable = false; updateBanner();
    content.textContent = "";
    content.appendChild(pageHead(txt("未知路由"), "地址无法识别"));
    content.appendChild(emptyPanel("没有这个页面", "可用路由：#/、#/capacity、#/shapes、#/submit、#/study/<id>、#/problem/<id>。"));
    document.title = "未知路由 · 评测控制台";
    return Promise.resolve();
  }
  var firstLoad = content.children.length === 0;
  if (firstLoad) showSkeleton();

  return fetchJSON(path).then(function (r) {
    if (stale()) return;
    unreachable = false;
    updateBanner();
    if (!r.ok) {
      var msg = (r.data && r.data.error) ? r.data.error : ("HTTP " + r.status);
      content.textContent = "";
      content.appendChild(pageHead(txt(TITLE[route.name] || "错误"), null));
      content.appendChild(errorBlock("HTTP " + r.status + "：" + msg,
        route.name === "overview"
          ? "提示：/api/overview 由后端并行提供；若尚未上线，可加 ?mock=1 预览完整界面。"
          : "返回总览：#/ 。若服务刚重启，稍后自动恢复。"));
      return;
    }
    if (route.name === "overview") { state.overview = r.data; renderOverview(); }
    else if (route.name === "capacity") renderCapacity(r.data);
    else if (route.name === "shapes") renderShapes(r.data);
    else if (route.name === "study") {
      if (state.studyId !== route.id) {
        state.studyId = route.id;
        state.expanded = {};
        state.studyStatusFilter = null;
      }
      state.study = r.data;
      renderStudy();
    }
    else renderProblem(r.data);
    lastRenderAt = Date.now();
    refreshInfo.textContent = "最近刷新 " +
      new Date().toLocaleTimeString("zh-CN", { hour12: false });
  }, function () {
    if (stale()) return;
    unreachable = true;   /* keep last rendered content on screen */
    updateBanner();
  });
}

function refreshNow() {
  refreshHealth();
  refreshRoute();
}

var timer = null;
function restartTimer() {
  if (timer !== null) clearInterval(timer);
  var sec = parseInt(document.getElementById("interval").value, 10) || 10;
  timer = setInterval(function () {
    if (!document.hidden) refreshNow();
  }, sec * 1000);
}

document.getElementById("interval").addEventListener("change", restartTimer);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) refreshNow();
});
window.addEventListener("hashchange", function () {
  content.textContent = "";
  refreshNow();
});

function openLookup() {
  var v = document.getElementById("lookup").value.trim();
  if (!v) return;
  if (v.indexOf("problem:") === 0) location.hash = "#/problem/" + encodeURIComponent(v);
  else location.hash = "#/study/" + encodeURIComponent(v);
}
document.getElementById("lookup").addEventListener("keydown", function (e) {
  if (e.key === "Enter") openLookup();
});

/* mock-only network-failure toggle (operator demo aid) */
if (MOCK) {
  var mf = document.getElementById("mockfail");
  mf.hidden = false;
  mf.addEventListener("click", function () {
    window.__mockFail = !window.__mockFail;
    mf.setAttribute("aria-pressed", window.__mockFail ? "true" : "false");
    mf.textContent = window.__mockFail ? "恢复服务" : "模拟断网";
    refreshNow();
  });
}

restartTimer();
refreshNow();
</script>
