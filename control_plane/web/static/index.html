<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simtakt · 仿真研究工作空间</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- App Sidebar Navigation & Utility Dock -->
    <aside class="app-sidebar" id="appSidebar" aria-label="Main Navigation">
      <!-- Brand & Mode Header -->
      <div class="sidebar-header">
        <a href="#/" class="brand" aria-label="Simtakt 首页">
          <div class="brand-mark" aria-hidden="true">
            <span class="mark-rule mark-1"></span>
            <span class="mark-rule mark-2"></span>
            <span class="mark-rule mark-3"></span>
          </div>
          <div class="brand-text">
            <span class="brand-name" id="brandName">Simtakt</span>
            <span class="brand-sub" id="brandSubtitle">仿真研究工作空间</span>
          </div>
        </a>
        <button type="button" class="sidebar-close" id="sidebarClose" aria-label="关闭导航">×</button>
      </div>

      <!-- Quick Search / Entity Lookup -->
      <div class="sidebar-search">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input type="text" id="lookup" placeholder="研究或模板名称" aria-label="按名称或编号查找研究和模板">
          <kbd class="search-kbd" id="searchKbd" title="按 Enter 跳转">↵</kbd>
        </div>
      </div>

      <!-- Navigation Links & Organized Sections -->
      <nav class="sidebar-nav" aria-label="Primary Navigation">
        <!-- 1. Primary & Unified Workbench Navigation -->
        <div class="nav-section primary-section">
          <a href="#/" id="nav-overview" class="nav-item cur">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>
            <span class="nav-label">总览</span>
          </a>
          <a href="#/submit" id="nav-compose" class="nav-item nav-workbench-item" title="实验研究">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-6 10a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L14 9V3M8 15h8"/></svg></span>
            <span class="nav-label">实验研究</span>
          </a>
          <a href="#/packages" id="nav-templates" class="nav-item">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="18" rx="2"/><path d="M6 7h1m10 0h1"/></svg></span>
            <span class="nav-label">仿真模板</span>
          </a>
        </div>

        <!-- 2. Operations & Monitoring Section -->
        <div class="nav-section ops-section">
          <div class="nav-section-head">
            <span class="nav-section-title meta" id="navOpsLabel">监控与资源</span>
          </div>
          <div class="nav-items-group">
            <a href="#/algorithms" id="nav-algorithms" class="nav-item">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5M5 17v-5h14v5"/></svg></span>
              <span class="nav-label">算法运行</span>
            </a>
            <a href="#/capacity" id="nav-capacity" class="nav-item">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 16v-4m5 4V7m5 9v-6"/></svg></span>
              <span class="nav-label">计算资源</span>
            </a>
            <a href="#/shapes" id="nav-shapes" class="nav-item">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8Zm0 10v8M3 8l9 5 9-5"/></svg></span>
              <span class="nav-label">运行性能</span>
            </a>
          </div>
        </div>
      </nav>

      <!-- Sidebar Utility Dock -->
      <div class="sidebar-dock">
        <!-- Health & Polling Panel -->
        <div class="dock-health-card">
          <div class="health-status-row">
            <div class="health-indicator">
              <span class="hdot ok" id="healthdot" aria-hidden="true"></span>
              <span class="health-txt" id="healthtxt">服务正常</span>
            </div>
            <label class="interval-picker" title="轮询刷新间隔">
              <span id="intervalLabel" class="sr-only">间隔</span>
              <select id="interval" aria-label="轮询间隔">
                <option value="5">5s</option>
                <option value="10" selected>10s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
              </select>
            </label>
          </div>
          <div class="health-refresh-row" id="refreshinfo">最近刷新 —</div>
        </div>

        <!-- Utility Action Strip -->
        <div class="dock-actions-strip">
          <button type="button" id="langBtn" class="dock-btn lang-btn" aria-label="Switch Language / 切换语言" title="切换语言 / Switch Language">
            <span class="dock-btn-icon" aria-hidden="true">🌐</span>
            <span id="langBtnText">EN</span>
          </button>

          <button type="button" id="helpBtn" class="dock-btn help-btn" aria-pressed="false" aria-label="切换说明与图例" title="状态图例与使用说明">
            <span class="dock-btn-icon" aria-hidden="true">?</span>
            <span id="helpBtnText">说明</span>
          </button>

          <button type="button" id="mockfail" class="dock-btn mock-btn" hidden aria-pressed="false">模拟断网</button>
        </div>
      </div>
    </aside>

    <!-- Mobile Drawer Backdrop Overlay -->
    <div class="app-sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Main Content Canvas -->
    <div class="app-main-canvas">
      <!-- Mobile Sticky Top Header (Visible on screen <= 880px) -->
      <header class="app-mobile-header" id="mobileHeader">
        <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="收起侧栏" aria-expanded="true" aria-controls="appSidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m5-11-3 3 3 3"/></svg>
        </button>
        <div class="mobile-header-brand">
          <span class="mobile-brand-name" id="mobileBrandName">Simtakt</span>
          <span class="mobile-route-title" id="mobileRouteTitle">总览</span>
        </div>
        <div class="mobile-header-status">
          <span class="mode-tag" id="modeTag">只读</span>
          <span class="hdot ok" id="mobileHealthDot" aria-hidden="true"></span>
        </div>
      </header>

      <!-- Network / Service Stale Alert Banner -->
      <div id="banner" role="alert" aria-live="polite">
        <div class="banner-inner">
          <span class="bicon" aria-hidden="true">⚠</span>
          <span id="bannertext">服务不可达，正在重试…</span>
        </div>
      </div>

      <!-- Dynamic View Root -->
      <main id="content" class="content-canvas"></main>

      <!-- Help & Legends Drawer -->
      <footer id="helpDrawer" class="help-drawer" style="display: none;"></footer>
    </div>
  </div>

  <!-- App Bootstrap Module -->
  <script type="module" src="/static/app.js"></script>
</body>
</html>
